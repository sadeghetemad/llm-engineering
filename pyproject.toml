[project]
name = "llm-engineering"
version = "0.1.0"
description = "Educational playground for LLM engineering: LangChain, RAG and fine-tuning."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0.0",
]
